[project]
name = "hicrayon"
version = "0.1.0"
description = "CLI tool for Hi-C and signal track cross-visualization with image generation"
authors = [
    {name = "BenNolann",email = "bennolan12@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy (>=2.4.2,<3.0.0)",
    "hic-straw (>=1.3.1,<2.0.0)",
    "matplotlib (>=3.10.8,<4.0.0)",
    "pybigwig (>=0.3.25,<0.4.0)",
    "pandas (>=3.0.0,<4.0.0)",
    "requests (>=2.32.5,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
